<!doctype html>
<!-- Source of the LinkedIn banner (1584x396), written to private/brand/linkedin-banner.png. Render: node scripts/build-brand.mjs -->
<!-- LinkedIn's profile photo covers the bottom left, so everything sits on the right. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Schibsted Grotesk"; src: url("../public/fonts/schibsted-grotesk-core.woff2") format("woff2"); font-weight: 400 600; }
  @font-face { font-family: "IBM Plex Mono"; src: url("../public/fonts/ibm-plex-mono-400-latin.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "IBM Plex Mono"; src: url("../public/fonts/ibm-plex-mono-500-latin.woff2") format("woff2"); font-weight: 500; }
  :root { --blueprint: #1E34B4; --bp-ink: #F6F8FF; --bp-soft: #C9D2FF; --bp-own: #2C43C6; --bp-line: rgb(255 255 255 / 0.14); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1584px; height: 396px; overflow: hidden; }
  body { font-family: "Schibsted Grotesk", sans-serif; color: var(--bp-ink); background-color: var(--blueprint);
    background-image: linear-gradient(var(--bp-line) 1px, transparent 1px), linear-gradient(90deg, var(--bp-line) 1px, transparent 1px);
    background-size: 24px 24px; background-position: -1px -1px;
    display: flex; flex-direction: column; align-items: flex-end; justify-content: center; padding: 0 72px 24px; gap: 20px; }
  .flow { display: flex; align-items: stretch; }
  .node { border: 2px solid var(--bp-ink); border-radius: 3px; background: var(--blueprint); padding: 14px 22px 16px; width: 324px; }
  .node.own { background: var(--bp-own); }
  .key { font-family: "IBM Plex Mono", monospace; font-size: 17px; color: var(--bp-soft); }
  .value { font-size: 36px; font-weight: 600; letter-spacing: -0.02em; margin-top: 2px; line-height: 1.15; }
  .value.fig { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 46px; letter-spacing: -0.035em; line-height: 1.1; }
  .detail { font-size: 19px; color: var(--bp-soft); margin-top: 4px; }
  .lead { width: 48px; align-self: center; border-top: 2px solid var(--bp-ink); position: relative; }
  .lead::after { content: ""; position: absolute; top: -7px; width: 10px; height: 10px; border-right: 2px solid var(--bp-ink); border-bottom: 2px solid var(--bp-ink); }
  .lead.right::after { right: 1px; transform: rotate(-45deg); }
  .lead.left::after { left: 1px; transform: rotate(135deg); }
  .caption { font-size: 20px; color: var(--bp-soft); display: flex; gap: 32px; }
  .caption b { color: var(--bp-ink); font-weight: 500; }
</style>
</head>
<body>
  <div class="flow">
    <div class="node own"><p class="key">results worker</p><p class="value">Built by me</p><p class="detail">SeaTable to versioned JSON</p></div>
    <div class="lead right"></div>
    <div class="node"><p class="key">S3 + CloudFront</p><p class="value fig">47</p><p class="detail">races served as cached JSON</p></div>
    <div class="lead left"></div>
    <div class="node"><p class="key">traffic</p><p class="value fig">500k+</p><p class="detail">peak concurrent requests</p></div>
  </div>
  <p class="caption"><span>Local Election 68 live results for Thai PBS</span><b>9chinz.github.io</b></p>
</body>
</html>
